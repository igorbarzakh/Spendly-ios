name: Backend

on:
  pull_request:
    paths:
      - backend/**
      - deploy/**
      - .github/workflows/backend.yml
  push:
    branches:
      - main
      - master
      - codex/**
    paths:
      - backend/**
      - deploy/**
      - .github/workflows/backend.yml

permissions:
  contents: read

env:
  GO_VERSION: "1.27.0"
  POSTGRES_IMAGE: "postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f"
  TEST_DATABASE_URL: "postgres://spendly:spendly@localhost:5432/spendly_test?sslmode=disable"

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
        env:
          POSTGRES_DB: spendly_test
          POSTGRES_USER: spendly
          POSTGRES_PASSWORD: spendly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spendly -d spendly_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Verify gofmt
        working-directory: backend
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test with race detector
        working-directory: backend
        run: go test -race ./...

      - name: Migration integration tests
        working-directory: backend
        run: go test -race ./internal/postgres -v

      - name: Build API image
        run: docker build --target api -t spendly-api:ci backend

      - name: Build migrate image
        run: docker build --target migrate -t spendly-migrate:ci backend

      - name: Compose config
        run: |
          cp deploy/.env.example deploy/.env
          docker compose --env-file deploy/.env -f deploy/compose.yaml config --quiet

      - name: Compose smoke test
        run: |
          cp deploy/.env.example deploy/.env
          token_key="$(openssl rand -base64 64 | tr -d '=\n')"
          TOKEN_SIGNING_KEY="$token_key" perl -0pi -e 's/^SPENDLY_DOMAIN=.*/SPENDLY_DOMAIN=localhost/m; s/^HTTP_PORT=.*/HTTP_PORT=18080/m; s/^HTTPS_PORT=.*/HTTPS_PORT=18443/m; s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=spendly/m; s#^DATABASE_URL=.*#DATABASE_URL=postgres://spendly:spendly\@postgres:5432/spendly?sslmode=disable#m; s/^TOKEN_SIGNING_KEY=.*/TOKEN_SIGNING_KEY=$ENV{TOKEN_SIGNING_KEY}/m' deploy/.env
          trap 'docker compose --env-file deploy/.env -f deploy/compose.yaml down -v --remove-orphans' EXIT
          docker compose --env-file deploy/.env -f deploy/compose.yaml up -d --build postgres
          docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm migrate up
          docker compose --env-file deploy/.env -f deploy/compose.yaml up -d --build api caddy
          SPENDLY_SMOKE_INSECURE=1 deploy/tests/smoke.sh

  deploy:
    name: Deploy backend
    runs-on: ubuntu-26.04
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Verify deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_HOST_KEY"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_PATH"

      - name: Configure SSH
        env:
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          port="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && SPENDLY_DEPLOY_SHA='$GITHUB_SHA' sh -s" <<'REMOTE'
          set -eu

          test -f deploy/.env
          git fetch --prune origin
          git reset --hard "$SPENDLY_DEPLOY_SHA"

          if grep -q '^SPENDLY_API_TAG=' deploy/.env; then
            sed -i "s/^SPENDLY_API_TAG=.*/SPENDLY_API_TAG=$SPENDLY_DEPLOY_SHA/" deploy/.env
          else
            printf '\nSPENDLY_API_TAG=%s\n' "$SPENDLY_DEPLOY_SHA" >> deploy/.env
          fi

          sh deploy/tests/config.sh
          docker compose --env-file deploy/.env -f deploy/compose.yaml config --quiet
          deploy/backup/backup.sh
          docker compose --env-file deploy/.env -f deploy/compose.yaml --profile tools build api migrate
          docker compose --env-file deploy/.env -f deploy/compose.yaml --profile tools run --rm migrate up
          docker compose --env-file deploy/.env -f deploy/compose.yaml up -d api caddy
          sh deploy/tests/smoke.sh
          REMOTE
