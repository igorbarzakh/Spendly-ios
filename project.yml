name: Spendly
options:
  bundleIdPrefix: app.spendly
  deploymentTarget:
    iOS: "17.0"
configs:
  Development: debug
  Staging: release
  Production: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  Spendly:
    type: application
    platform: iOS
    sources:
      - ios/Spendly
    configFiles:
      Development: ios/Spendly/Resources/Development.xcconfig
      Staging: ios/Spendly/Resources/Staging.xcconfig
      Production: ios/Spendly/Resources/Production.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.spendly.ios
        PRODUCT_NAME: Spendly
  SpendlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ios/SpendlyTests
    dependencies:
      - target: Spendly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.spendly.ios.tests
schemes:
  Spendly:
    build:
      targets:
        Spendly: all
        SpendlyTests: [test]
    run:
      config: Development
    test:
      config: Development
      gatherCoverageData: true
      targets:
        - SpendlyTests
    profile:
      config: Staging
    analyze:
      config: Development
    archive:
      config: Production

